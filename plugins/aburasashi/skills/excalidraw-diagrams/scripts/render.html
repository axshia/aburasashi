<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>render</title>
<style>body{margin:0;background:#fff;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif}</style>
</head>
<body>
<div id="out"></div>
<script>window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.17.6/dist/";</script>
<script type="module">
// Renders ?file=<scene>.excalidraw (served from the same directory) to a PNG.
// When done, the title becomes "done", the image is shown in #out, and the
// data URL is available as window.__png. On failure the title starts with "error".
import Excalidraw from "https://esm.sh/@excalidraw/excalidraw@0.17.6";
const { exportToBlob } = Excalidraw;
const params = new URLSearchParams(location.search);
const name = params.get("file");
const scale = Number(params.get("scale") || "2");
try {
  const scene = await (await fetch(name, { cache: "no-store" })).json();
  const blob = await exportToBlob({
    elements: scene.elements,
    appState: { ...scene.appState, exportBackground: true, exportScale: scale },
    files: scene.files || {},
    mimeType: "image/png",
    exportPadding: 30,
  });
  const reader = new FileReader();
  reader.onload = () => {
    window.__png = reader.result;
    const img = new Image();
    img.alt = "diagram";
    img.onload = () => {
      img.style.width = img.naturalWidth / scale + "px";
      img.style.display = "block";
      document.title = "done";
    };
    img.src = reader.result;
    document.getElementById("out").appendChild(img);
  };
  reader.readAsDataURL(blob);
} catch (e) {
  document.title = "error: " + e;
}
</script>
</body>
</html>
